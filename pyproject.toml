[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pythontextstats"
version = "2.0.0a1"
description = "Dependency-free text statistics and English readability estimates"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Vignesh Selvaraj", email = "vigneshaasiga2020@gmail.com"}]
keywords = ["text analysis", "readability", "statistics", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
    "Operating System :: OS Independent",
]

[project.scripts]
pythontextstats = "pythontextstats.cli:main"

[project.urls]
Homepage = "https://github.com/Vigneshselvaraj1811/pythontextstats"
Repository = "https://github.com/Vigneshselvaraj1811/pythontextstats"
Issues = "https://github.com/Vigneshselvaraj1811/pythontextstats/issues"
Changelog = "https://github.com/Vigneshselvaraj1811/pythontextstats/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["pythontextstats*"]
